<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keranjang Belanja | Mitra Kemasan Gemilang</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css"></head>
<body data-page="cart"><div id="site-header"></div>
<main>
<div class="page-head"><div class="container"><h1>Keranjang Belanja</h1></div></div>
<div class="container py-4" id="cart-content"><div class="text-center py-5"><div class="spinner-border text-info"></div></div></div>
<div class="modal fade" id="clear-cart-modal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Kosongkan Keranjang</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button></div><div class="modal-body"><p class="mb-0">Semua produk di keranjang akan dihapus. Yakin ingin melanjutkan?</p></div><div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Batal</button><button type="button" class="btn btn-danger" id="confirm-clear-cart">Ya, Kosongkan</button></div></div></div></div>
<div class="modal fade" id="checkout-modal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><form id="checkout-form" novalidate>
<div class="modal-header"><h5 class="modal-title">Data Pemesan</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button></div>
<div class="modal-body"><div class="mb-3"><label class="form-label" for="nama">Nama lengkap</label><input class="form-control" id="nama" name="nama" required minlength="3"><div class="invalid-feedback">Nama lengkap wajib diisi.</div></div>
<div class="mb-3"><label class="form-label" for="telp">Nomor WhatsApp</label><input class="form-control" id="telp" name="telp" type="tel" required placeholder="08123456789"><div class="invalid-feedback">Masukkan nomor WhatsApp yang valid.</div></div>
<div class="mb-3"><label class="form-label" for="alamat">Alamat pengiriman</label><textarea class="form-control" id="alamat" name="alamat" rows="2" required minlength="8"></textarea><div class="invalid-feedback">Alamat pengiriman wajib diisi lengkap.</div></div>
<div><label class="form-label" for="catatan">Catatan pesanan <span class="text-muted">(opsional)</span></label><textarea class="form-control" id="catatan" name="catatan" rows="2"></textarea></div></div>
<div class="modal-footer"><button class="btn btn-success w-100 btn-lg" type="submit"><i class="bi bi-whatsapp"></i> Kirim Pesanan via WhatsApp</button></div></form></div></div></div></main>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/config.js"></script><script src="assets/js/common.js"></script><script src="assets/js/cart.js"></script><script src="assets/js/checkout.js"></script>
</body></html>
