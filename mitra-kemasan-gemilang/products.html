<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Katalog Produk | Mitra Kemasan Gemilang</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css"></head>
<body data-page="products"><div id="site-header"></div>
<main>
<div class="page-head"><div class="container"><h1>Katalog Produk</h1><p class="text-muted m-0" id="info">Memuat produk...</p></div></div>
<div class="container py-4"><div class="row g-4">
<aside class="col-lg-3"><button class="btn btn-outline-teal w-100 d-lg-none mb-3" data-bs-toggle="collapse" data-bs-target="#filter-wrap"><i class="bi bi-funnel"></i> Filter &amp; Urutkan</button>
<div class="collapse d-lg-block" id="filter-wrap"><form class="filter-box" id="filters">
<label class="form-label fw-semibold" for="f-q">Cari produk</label><input id="f-q" class="form-control mb-3" type="search" placeholder="Contoh: plastik klip">
<label class="form-label fw-semibold" for="f-cat">Kategori</label><select id="f-cat" class="form-select mb-3"><option value="">Semua kategori</option></select>
<label class="form-label fw-semibold" for="f-price">Rentang harga</label><select id="f-price" class="form-select mb-3"><option value="0-">Semua harga</option><option value="0-20000">Di bawah Rp20.000</option><option value="20000-50000">Rp20.000 - Rp50.000</option><option value="50000-100000">Rp50.000 - Rp100.000</option><option value="100000-">Di atas Rp100.000</option></select>
<label class="form-label fw-semibold" for="f-sort">Urutkan</label><select id="f-sort" class="form-select mb-3"><option value="default">Terbaru</option><option value="harga-asc">Harga terendah</option><option value="harga-desc">Harga tertinggi</option><option value="nama">Nama A-Z</option><option value="promo">Diskon terbesar</option></select>
<label class="form-label fw-semibold" for="f-per">Produk per halaman</label><select id="f-per" class="form-select mb-3"><option>12</option><option>24</option><option>48</option></select>
<button type="button" class="btn btn-outline-secondary w-100" id="f-reset">Reset Filter</button></form></div></aside>
<section class="col-lg-9"><div class="row row-cols-2 row-cols-md-3 g-3" id="grid"><div class="col-12 text-center py-5"><div class="spinner-border text-info"></div></div></div>
<nav class="mt-4 d-flex justify-content-center" aria-label="Halaman"><ul class="pagination flex-wrap" id="pagination"></ul></nav></section></div></div></main>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/config.js"></script><script src="assets/js/common.js"></script><script src="assets/js/products.js"></script>
</body></html>
