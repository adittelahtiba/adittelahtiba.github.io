
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 700 150"
  width="100%"
  role="img"
  aria-label="Ryka dan Adit"
>
  <defs>
    <linearGradient
      id="goldShimmer"
      x1="0"
      y1="0"
      x2="1"
      y2="0"
      gradientUnits="objectBoundingBox"
      gradientTransform="translate(-1 0)"
    >
      <stop offset="15%" stop-color="#B08A4A"/>
      <stop offset="35%" stop-color="#C9A96E"/>
      <stop offset="50%" stop-color="#FFF6E5"/>
      <stop offset="65%" stop-color="#C9A96E"/>
      <stop offset="85%" stop-color="#B08A4A"/>

      <animateTransform
        attributeName="gradientTransform"
        type="translate"
        from="-1 0"
        to="1 0"
        dur="4s"
        repeatCount="indefinite"
      />
    </linearGradient>
  </defs>

  <text
    x="350"
    y="105"
    text-anchor="middle"
    fill="url(#goldShimmer)"
    font-family="Georgia, serif"
    font-size="88"
    font-weight="bold"
  >Ryka &amp; Adit</text>
</svg>
